<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>runtime.log</title>


<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#020403;

  color:#b7ffca;

  font-family:
    "Courier New",
    Consolas,
    monospace;

}

body{

  text-shadow:
    0 0 5px rgba(80,255,130,.28);

  transition:
    filter .03s linear;

}


/* =========================================================
   MATRIX
========================================================= */

#matrix{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  opacity:.09;

  pointer-events:none;

}


/* =========================================================
   CRT OVERLAY
========================================================= */

#crt{

  position:fixed;

  inset:0;

  z-index:50;

  pointer-events:none;

  background:

    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0),
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.18) 3px
    );

  opacity:.42;

}


/* CRT vignette */

#crt::after{

  content:"";

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(0,0,0,.45) 100%
    );

}


/* =========================================================
   MAIN APP
========================================================= */

#app{

  position:relative;

  width:100%;
  height:100%;

  padding:18px;

  overflow:hidden;

}


/* =========================================================
   TOP BAR
========================================================= */

.top{

  height:34px;

  border-bottom:
    1px solid #163d23;

  color:#6d9d78;

  font-size:12px;

  display:flex;

  justify-content:space-between;

  align-items:center;

}


/* =========================================================
   LOG
========================================================= */

#log{

  height:
    calc(100% - 34px);

  padding-top:12px;

  overflow:hidden;

  white-space:pre;

  font-size:
    clamp(10px,1.15vw,14px);

  line-height:1.42;

}


/* =========================================================
   COLORS
========================================================= */

.green{
  color:#8cffaa;
}

.cyan{
  color:#73e9ff;
}

.yellow{
  color:#e4d76a;
}

.red{

  color:#ff5151;

  text-shadow:
    0 0 9px rgba(255,40,40,.6);

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.bar{

  display:inline-block;

  width:240px;

  height:10px;

  border:
    1px solid #315e3d;

  padding:1px;

  vertical-align:middle;

}

.fill{

  display:block;

  height:100%;

  width:0;

  background:#74ff94;

  box-shadow:
    0 0 10px #74ff94;

}


/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{

  position:fixed;

  inset:0;

  z-index:200;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,0,0,.94);

  color:#ff3434;

  font-size:
    clamp(120px,28vw,300px);

  text-shadow:
    0 0 35px red;

}


/* =========================================================
   NETWORK PANEL
========================================================= */

#network{

  position:fixed;

  right:18px;

  bottom:18px;

  z-index:40;

  width:230px;

  padding:10px;

  border:
    1px solid #163d23;

  background:
    rgba(0,8,3,.78);

  color:#477c54;

  font-size:10px;

  opacity:.8;

}

.net-title{

  color:#6d9d78;

  border-bottom:
    1px solid #163d23;

  padding-bottom:5px;

  margin-bottom:6px;

}


/* =========================================================
   CAMERA INDICATOR
========================================================= */

#camera{

  position:fixed;

  right:18px;

  top:58px;

  z-index:40;

  color:#ff5151;

  font-size:10px;

  opacity:.75;

}

.cam-dot{

  display:inline-block;

  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff3030;

  box-shadow:
    0 0 8px red;

  margin-right:5px;

  animation:
    camblink .5s infinite;

}


/* =========================================================
   GLITCH
========================================================= */

#glitch{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  background:#000;

  pointer-events:none;

}


#glitch::before{

  content:"";

  position:absolute;

  inset:0;

  background:

    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.08) 4px
    );

}


#glitch::after{

  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,0,0,.28) 48%,
      transparent 52%
    );

}


.glitch-active{

  display:block!important;

  animation:
    glitchScreen .07s infinite;

}


/* =========================================================
   SYSTEM FAILURE
========================================================= */

#crash{

  position:fixed;

  inset:0;

  z-index:600;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  background:#000;

  color:#ff3030;

  text-align:center;

}


#crash.show{

  display:flex;

}


#crash .title{

  font-size:
    clamp(32px,6vw,80px);

  font-weight:bold;

  letter-spacing:8px;

  text-shadow:

    0 0 10px red,
    0 0 30px red;

}


#crash .sub{

  margin-top:18px;

  font-size:
    clamp(11px,1.5vw,16px);

  color:#777;

  letter-spacing:3px;

}


.cursor{

  display:inline-block;

  width:8px;

  height:18px;

  background:#ff3030;

  margin-left:5px;

  animation:
    blink .6s infinite;

}


/* =========================================================
   ANIMATIONS
========================================================= */

.flash{

  animation:
    flash .09s infinite;

}


.shake{

  animation:
    shake .055s infinite;

}


@keyframes shake{

  0%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(4px,-3px);
  }

  50%{
    transform:translate(-4px,3px);
  }

  75%{
    transform:translate(3px,2px);
  }

  100%{
    transform:translate(0,0);
  }

}


@keyframes flash{

  50%{
    opacity:.08;
  }

}


@keyframes blink{

  50%{
    opacity:0;
  }

}


@keyframes camblink{

  50%{
    opacity:.15;
  }

}


@keyframes glitchScreen{

  0%{

    transform:
      translate(0);

    filter:none;

  }

  15%{

    transform:
      translate(-14px,4px)
      skewX(2deg);

    filter:
      hue-rotate(90deg)
      contrast(2);

  }

  30%{

    transform:
      translate(12px,-4px);

    filter:
      invert(.15)
      contrast(3);

  }

  45%{

    transform:
      translate(-7px,7px);

    filter:
      hue-rotate(180deg);

  }

  60%{

    transform:
      translate(9px,-5px);

    filter:
      contrast(4);

  }

  75%{

    transform:
      translate(-12px,2px);

    filter:
      saturate(3);

  }

  100%{

    transform:
      translate(0);

    filter:none;

  }

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

  display:none!important;

}

</style>

</head>


<body>


<canvas id="matrix"></canvas>


<div id="app">


  <div class="top">

    <span>
      runtime/diagnostic
    </span>

    <span id="time">
      00:00.000
    </span>

  </div>


  <div id="log"></div>


</div>


<!-- CAMERA -->

<div id="camera">

  <span class="cam-dot"></span>

  CAMERA DEVICE:
  <span id="camText">
    SCANNING
  </span>

</div>


<!-- NETWORK -->

<div id="network">

  <div class="net-title">
    NETWORK TRACE
  </div>

  <div id="netlog">
    initializing...
  </div>

</div>


<!-- COUNTDOWN -->

<div
  id="countdown"
  class="hidden"
>
  3
</div>


<!-- GLITCH -->

<div id="glitch"></div>


<!-- CRASH -->

<div id="crash">

  <div class="title">
    SYSTEM FAILURE
  </div>

  <div class="sub">

    runtime terminated unexpectedly

    <span class="cursor"></span>

  </div>

</div>


<!-- CRT -->

<div id="crt"></div>


<script>


/* =========================================================
   CLOCK
========================================================= */

const started =
  performance.now();


setInterval(()=>{

  const t =
    performance.now() -
    started;


  const s =
    Math.floor(t/1000);


  const ms =
    Math.floor(t%1000);


  document.getElementById(
    "time"
  ).textContent =
    `00:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;

},20);


/* =========================================================
   AUDIO
========================================================= */

let audio=null;


function initAudio(){

  try{

    if(!audio){

      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audio.state ===
      "suspended"
    ){

      audio.resume();

    }

  }catch(e){}

}


/* =========================================================
   KEY SOUND
========================================================= */

function keySound(){

  if(!audio) return;


  try{

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();


    osc.type="square";


    osc.frequency.value =
      420 +
      Math.random()*300;


    gain.gain.setValueAtTime(
      .018,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.035
    );


    osc.connect(gain);

    gain.connect(
      audio.destination
    );


    osc.start();

    osc.stop(
      audio.currentTime+.04
    );

  }catch(e){}

}


/* =========================================================
   SCAN SOUND
========================================================= */

function scanSound(){

  if(!audio) return;


  try{

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();


    osc.type="sine";


    osc.frequency.setValueAtTime(
      350,
      audio.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
      850,
      audio.currentTime+.12
    );


    gain.gain.setValueAtTime(
      .025,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.14
    );


    osc.connect(gain);

    gain.connect(
      audio.destination
    );


    osc.start();

    osc.stop(
      audio.currentTime+.15
    );

  }catch(e){}

}


/* =========================================================
   WARNING
========================================================= */

function warningSound(){

  if(!audio) return;


  try{

    [0,.18,.36].forEach(
      delay=>{

        const osc =
          audio.createOscillator();

        const gain =
          audio.createGain();


        osc.type="square";

        osc.frequency.value=880;


        gain.gain.setValueAtTime(
          .035,
          audio.currentTime+delay
        );


        gain.gain.exponentialRampToValueAtTime(
          .001,
          audio.currentTime+
          delay+
          .1
        );


        osc.connect(gain);

        gain.connect(
          audio.destination
        );


        osc.start(
          audio.currentTime+
          delay
        );


        osc.stop(
          audio.currentTime+
          delay+
          .11
        );

      }
    );

  }catch(e){}

}


/* =========================================================
   CRASH SOUND
========================================================= */

function crashSound(){

  if(!audio) return;


  try{

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();


    osc.type="sawtooth";


    osc.frequency.setValueAtTime(
      190,
      audio.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
      28,
      audio.currentTime+.75
    );


    gain.gain.setValueAtTime(
      .13,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.75
    );


    osc.connect(gain);

    gain.connect(
      audio.destination
    );


    osc.start();

    osc.stop(
      audio.currentTime+.8
    );

  }catch(e){}

}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdownSound(
  final=false
){

  if(!audio) return;


  try{

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();


    osc.type="square";


    osc.frequency.value =
      final
      ? 1200
      : 650;


    gain.gain.setValueAtTime(
      final ? .07 : .04,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.18
    );


    osc.connect(gain);

    gain.connect(
      audio.destination
    );


    osc.start();

    osc.stop(
      audio.currentTime+.2
    );

  }catch(e){}

}


/* =========================================================
   MATRIX
========================================================= */

const canvas =
  document.getElementById(
    "matrix"
  );


const ctx =
  canvas.getContext("2d");


function resize(){

  canvas.width =
    innerWidth;

  canvas.height =
    innerHeight;

}


resize();


addEventListener(
  "resize",
  resize
);


const chars =
  "01ABCDEF#$%&@<>[]{}";


let drops=[];


function resetDrops(){

  drops =
    Array(
      Math.floor(
        innerWidth/15
      )
    ).fill(1);

}


resetDrops();


setInterval(()=>{

  ctx.fillStyle =
    "rgba(0,0,0,.09)";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#19ff68";


  ctx.font =
    "14px monospace";


  for(
    let i=0;
    i<drops.length;
    i++
  ){

    ctx.fillText(

      chars[
        Math.floor(
          Math.random()*
          chars.length
        )
      ],

      i*15,

      drops[i]*15

    );


    if(

      drops[i]*15 >
      canvas.height &&
      Math.random()>.97

    ){

      drops[i]=0;

    }


    drops[i]++;

  }

},40);


/* =========================================================
   TERMINAL
========================================================= */

const log =
  document.getElementById(
    "log"
  );


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function line(
  text="",
  cls=""
){

  const d =
    document.createElement(
      "div"
    );


  d.className =
    cls;


  d.textContent =
    text;


  log.appendChild(d);


  log.scrollTop =
    log.scrollHeight;


  keySound();

}


/* =========================================================
   PROGRESS
========================================================= */

function progress(
  label,
  duration
){

  return new Promise(
    resolve=>{

      const d =
        document.createElement(
          "div"
        );


      const bar =
        document.createElement(
          "span"
        );


      const fill =
        document.createElement(
          "span"
        );


      bar.className =
        "bar";


      fill.className =
        "fill";


      bar.appendChild(
        fill
      );


      d.append(
        document.createTextNode(
          label+" "
        ),
        bar
      );


      log.appendChild(d);


      scanSound();


      const start =
        performance.now();


      function update(){

        const p =
          Math.min(
            1,
            (
              performance.now()-
              start
            )/duration
          );


        fill.style.width =
          (p*100)+"%";


        if(p<1){

          requestAnimationFrame(
            update
          );

        }else{

          resolve();

        }

      }


      requestAnimationFrame(
        update
      );

    }
  );

}


/* =========================================================
   HEX
========================================================= */

function hex(n=8){

  const chars =
    "0123456789ABCDEF";


  let s="";


  for(
    let i=0;
    i<n;
    i++
  ){

    s +=
      chars[
        Math.floor(
          Math.random()*16
        )
      ];

  }


  return s;

}


/* =========================================================
   NETWORK TRACE
========================================================= */

const netlog =
  document.getElementById(
    "netlog"
  );


const networkMessages=[

  "initializing network stack...",

  "interface eth0 detected",

  "scanning route table...",

  "gateway 192.168.1.1",

  "resolving remote node...",

  "node 01 reachable",

  "node 02 reachable",

  "packet stream detected",

  "encrypted channel established",

  "remote endpoint: 185."+hex(3)+"."+hex(3)+"."+hex(2),

  "trace synchronization complete"

];


let netIndex=0;


async function networkTrace(){

  while(
    netIndex <
    networkMessages.length
  ){

    netlog.textContent =
      networkMessages[
        netIndex
      ];

    netIndex++;

    await wait(
      230 +
      Math.random()*220
    );

  }

}


/* =========================================================
   FAKE CAMERA
========================================================= */

async function cameraSequence(){

  const cam =
    document.getElementById(
      "camText"
    );


  await wait(700);

  cam.textContent =
    "DETECTING";


  await wait(700);

  cam.textContent =
    "DEVICE FOUND";


  await wait(900);

  cam.textContent =
    "ACCESSING";


  await wait(850);

  cam.textContent =
    "DENIED";


  cam.style.color =
    "#6d9d78";

}


/* =========================================================
   FULLSCREEN ATTEMPT
========================================================= */

async function fullscreen(){

  try{

    if(
      !document.fullscreenElement
    ){

      await document.documentElement
        .requestFullscreen();

    }

  }catch(e){

    /*
      Browsers may block
      automatic fullscreen
      without user interaction.
    */

  }

}


/* =========================================================
   MAIN
========================================================= */

async function run(){

  /*
    Visual sequence starts
    immediately.
  */

  initAudio();

  fullscreen();

  networkTrace();

  cameraSequence();


  /* =====================================================
     START
  ===================================================== */

  line(
    "$ ./runtime --attach --quiet",
    "cyan"
  );


  await wait(70);


  line(
    "[000] pid=4812 tid=07 arch=x86_64"
  );


  line(
    "[001] ctx=0x"+
    hex(12)+
    " sp=0x"+
    hex(12)
  );


  await wait(70);


  /* =====================================================
     MEMORY
  ===================================================== */

  for(
    let i=0;
    i<4;
    i++
  ){

    line(
      `[${String(i+2).padStart(3,"0")}] `+
      `0x00${hex(6)} `+
      [
        "7F 45 4C 46 02 01 01 00",
        "48 8B 05 91 2A 00 00 48",
        "31 C0 48 89 E7 E8 19 00",
        "FF 25 72 10 00 00 90 90"
      ][i]
    );


    await wait(65);

  }


  await progress(
    "[006] resolving symbols",
    300
  );


  /* =====================================================
     NETWORK
  ===================================================== */

  line(
    "[007] opening encrypted channel...",
    "cyan"
  );


  await wait(90);


  line(
    "[008] handshake=0x"+
    hex(8)
  );


  line(
    "[009] remote key="+
    hex(32),
    "cyan"
  );


  await wait(80);


  /* =====================================================
     MEMORY SEGMENTS
  ===================================================== */

  for(
    let i=0;
    i<4;
    i++
  ){

    line(
      `[${String(i+10).padStart(3,"0")}] `+
      `map=0x${hex(8)} `+
      `len=0x${hex(4)} `+
      `perm=r-x`
    );


    await wait(60);

  }


  await progress(
    "[014] parsing memory segments",
    320
  );


  /* =====================================================
     CAMERA
  ===================================================== */

  line(
    "[015] enumerating camera devices..."
  );


  await wait(120);


  line(
    "[016] camera interface detected",
    "yellow"
  );


  await wait(120);


  line(
    "[017] device permission state=UNKNOWN"
  );


  /* =====================================================
     EXECUTION
  ===================================================== */

  await progress(
    "[018] validating execution context",
    320
  );


  line(
    `[019] rsp=0x${hex(12)} rbp=0x${hex(12)}`
  );


  line(
    `[020] flags=0x${hex(4)} state=0x${hex(2)}`
  );


  line(
    `[021] nonce=${hex(24)}`
  );


  await wait(80);


  line(
    `[022] digest=${hex(32)}`,
    "cyan"
  );


  await progress(
    "[023] rebuilding state vector",
    320
  );


  line(
    `[024] frame=0x${hex(16)}`
  );


  line(
    `[025] return=0x${hex(12)}`
  );


  await wait(90);


  line(
    "[026] state transition: 0x03 -> 0x04",
    "green"
  );


  await progress(
    "[027] committing state",
    300
  );


  line(
    `[028] seq=${hex(10)} status=0x${hex(2)}`
  );


  warningSound();


  await wait(120);


  /* =====================================================
     FAILURE
  ===================================================== */

  line(
    "[029] integrity boundary crossed",
    "red"
  );


  document.body.classList.add(
    "shake"
  );


  await wait(180);


  document.body.classList.remove(
    "shake"
  );


  line(
    `[030] session=${hex(16)}`,
    "cyan"
  );


  line(
    "[031] transition pending...",
    "yellow"
  );


  await wait(110);


  line(
    `[032] finalize=0x${hex(8)}`,
    "red"
  );


  warningSound();


  await wait(150);


  /* =====================================================
     COUNTDOWN
  ===================================================== */

  const cd =
    document.getElementById(
      "countdown"
    );


  cd.classList.remove(
    "hidden"
  );


  for(
    let n=3;
    n>=1;
    n--
  ){

    cd.textContent =
      n;


    countdownSound(
      n===1
    );


    if(
      n===1
    ){

      document.body.classList.add(
        "shake"
      );

    }


    await wait(1000);

  }


  cd.textContent="";


  cd.classList.add(
    "flash"
  );


  countdownSound(true);


  await wait(300);


  /* =====================================================
     FINAL GLITCH
  ===================================================== */

  document.body.classList.remove(
    "shake"
  );


  cd.classList.add(
    "hidden"
  );


  const glitch =
    document.getElementById(
      "glitch"
    );


  const crash =
    document.getElementById(
      "crash"
    );


  document.body.classList.add(
    "shake"
  );


  glitch.classList.add(
    "glitch-active"
  );


  warningSound();

  crashSound();


  /* rapid glitch */

  for(
    let i=0;
    i<14;
    i++
  ){

    await wait(55);


    document.body.style.filter =
      i%2===0

      ?

      "invert(.22) contrast(3) saturate(2)"

      :

      "none";

  }


  /* =====================================================
     BLACKOUT
  ===================================================== */

  document.body.classList.remove(
    "shake"
  );


  document.body.style.filter =
    "none";


  glitch.classList.remove(
    "glitch-active"
  );


  document.getElementById(
    "app"
  ).style.display =
    "none";


  document.getElementById(
    "network"
  ).style.display =
    "none";


  document.getElementById(
    "camera"
  ).style.display =
    "none";


  canvas.style.display =
    "none";


  document.getElementById(
    "crt"
  ).style.display =
    "none";


  await wait(120);


  /* =====================================================
     SYSTEM FAILURE
  ===================================================== */

  crash.classList.add(
    "show"
  );


  await wait(1900);


  /* =====================================================
     FINAL POWER OFF
  ===================================================== */

  crash.classList.remove(
    "show"
  );


  document.body.style.background =
    "#000";


  document.body.style.cursor =
    "none";


  await wait(800);


  /*
    Attempt to close tab.
    Normal browser tabs may refuse.
  */

  window.close();

}


/* =========================================================
   START IMMEDIATELY
========================================================= */

run();

</script>
