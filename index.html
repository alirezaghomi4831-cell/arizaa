<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>runtime.log</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020403;
  color:#b7ffca;
  font-family:"Courier New",Consolas,monospace;
}

body{
  text-shadow:0 0 5px rgba(80,255,130,.28);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:500;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.018) 0px,
    rgba(255,255,255,.018) 1px,
    transparent 2px,
    transparent 4px
  );
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:501;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    transparent 45%,
    rgba(0,0,0,.55) 100%
  );
}

canvas{
  position:fixed;
  inset:0;
  opacity:.08;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  padding:18px;
}

.top{
  height:34px;
  border-bottom:1px solid #163d23;
  color:#6d9d78;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#log{
  height:calc(100% - 34px);
  padding-top:12px;
  overflow:hidden;
  white-space:pre;
  font-size:clamp(10px,1.15vw,14px);
  line-height:1.42;
}

.green{color:#8cffaa}
.cyan{color:#73e9ff}
.yellow{color:#e4d76a}

.red{
  color:#ff5151;
  text-shadow:0 0 9px rgba(255,40,40,.6);
}

.bar{
  display:inline-block;
  width:240px;
  height:10px;
  border:1px solid #315e3d;
  padding:1px;
  vertical-align:middle;
}

.fill{
  display:block;
  height:100%;
  width:0;
  background:#74ff94;
  box-shadow:0 0 10px #74ff94;
}

/* ACCESS DENIED */

#accessDenied{
  position:fixed;
  inset:0;
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.88);
  color:#ff3b3b;
  font-size:clamp(45px,10vw,120px);
  font-weight:bold;
  letter-spacing:7px;
  text-shadow:
    0 0 12px red,
    0 0 35px red;
}

#accessDenied.show{
  display:flex;
  animation:accessFlash .45s infinite;
}

@keyframes accessFlash{
  0%,100%{opacity:1}
  50%{opacity:.45}
}

/* NOTIFICATIONS */

#notifications{
  position:fixed;
  top:16px;
  right:16px;
  z-index:800;
  width:360px;
  max-width:calc(100vw - 32px);
  display:flex;
  flex-direction:column;
  gap:9px;
  pointer-events:none;
}

.notification{
  direction:ltr;
  display:grid;
  grid-template-columns:36px 1fr;
  gap:11px;
  padding:13px 14px;
  background:rgba(32,33,36,.97);
  border:1px solid rgba(255,255,255,.09);
  border-radius:10px;
  color:#e8eaed;
  font-family:Arial,"Segoe UI",sans-serif;
  box-shadow:0 5px 22px rgba(0,0,0,.55);
  transform:translateX(120%);
  opacity:0;
  animation:notifIn .28s ease forwards;
}

.notification.rtl{
  direction:rtl;
  text-align:right;
}

.notification .icon{
  width:36px;
  height:36px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ea4335;
  color:#fff;
  font-size:20px;
  font-weight:bold;
}

.notification .sender{
  font-size:12px;
  color:#bdc1c6;
  margin-bottom:4px;
}

.notification .title{
  font-size:13px;
  font-weight:600;
  color:#f1f3f4;
  margin-bottom:3px;
}

.notification .message{
  font-size:12px;
  line-height:1.45;
  color:#bdc1c6;
}

.notification .time{
  color:#80868b;
  font-size:10px;
  margin-left:5px;
}

.notification.out{
  animation:notifOut .25s ease forwards;
}

@keyframes notifIn{
  from{
    transform:translateX(120%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes notifOut{
  to{
    transform:translateX(120%);
    opacity:0;
  }
}

/* CRITICAL */

#critical{
  position:fixed;
  inset:0;
  z-index:850;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#050000;
  color:#ff3030;
  text-align:center;
}

#critical.show{
  display:flex;
}

#critical .main{
  font-size:clamp(28px,6vw,80px);
  font-weight:bold;
  letter-spacing:8px;
  text-shadow:
    0 0 10px red,
    0 0 35px red;
}

#critical .sub{
  margin-top:16px;
  color:#8b2929;
  font-size:clamp(10px,1.5vw,16px);
  letter-spacing:3px;
}

/* COUNTDOWN */

#countdown{
  position:fixed;
  inset:0;
  z-index:900;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.96);
  color:#ff3434;
  font-size:clamp(120px,28vw,300px);
  text-shadow:
    0 0 25px red,
    0 0 60px red;
}

.hidden{
  display:none!important;
}

/* GLITCH */

#glitch{
  position:fixed;
  inset:0;
  z-index:999;
  display:none;
  background:#000;
  pointer-events:none;
}

#glitch::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(255,255,255,.09) 4px
  );
}

#glitch::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,0,0,.35),
    transparent
  );
}

.glitch-active{
  display:block!important;
  animation:glitch .07s infinite;
}

@keyframes glitch{
  0%{
    transform:translate(0);
    filter:none;
  }

  25%{
    transform:translate(-12px,3px);
    filter:hue-rotate(90deg) contrast(2);
  }

  50%{
    transform:translate(10px,-4px);
    filter:contrast(3);
  }

  75%{
    transform:translate(-7px,5px);
    filter:hue-rotate(180deg);
  }

  100%{
    transform:translate(0);
    filter:none;
  }
}

/* SYSTEM FAILURE */

#crash{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#000;
  text-align:center;
  color:#ff3030;
}

#crash.show{
  display:flex;
}

#crash .title{
  font-size:clamp(30px,6vw,80px);
  font-weight:bold;
  letter-spacing:8px;
  text-shadow:
    0 0 10px red,
    0 0 30px red,
    0 0 60px rgba(255,0,0,.5);
}

#crash .sub{
  margin-top:18px;
  color:#555;
  font-size:clamp(10px,1.5vw,16px);
  letter-spacing:3px;
}

.shake{
  animation:shake .06s infinite;
}

.flash{
  animation:flash .08s infinite;
}

@keyframes shake{
  25%{transform:translate(4px,-2px)}
  50%{transform:translate(-4px,3px)}
  75%{transform:translate(3px,1px)}
}

@keyframes flash{
  50%{opacity:.08}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

  <div class="top">
    <span>runtime/diagnostic</span>
    <span id="time">00:00.000</span>
  </div>

  <div id="log"></div>

</div>

<div id="notifications"></div>

<div id="accessDenied">
  ACCESS DENIED
</div>

<div id="critical">

  <div class="main">
    !!! CRITICAL !!!
  </div>

  <div class="sub">
    SESSION STATE INVALID
  </div>

</div>

<div id="countdown" class="hidden">
  3
</div>

<div id="glitch"></div>

<div id="crash">

  <div class="title">
    SYSTEM FAILURE
  </div>

  <div class="sub">
    runtime terminated unexpectedly
  </div>

</div>

<script>

let audio=null;

function initAudio(){

  if(!audio){
    audio=new(
      window.AudioContext||
      window.webkitAudioContext
    )();
  }

  if(audio.state==="suspended"){
    audio.resume();
  }
}

function keySound(){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="square";
  osc.frequency.value=420+Math.random()*300;

  gain.gain.setValueAtTime(
    .018,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.035
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+.04);
}

function diskSound(){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="triangle";

  osc.frequency.setValueAtTime(
    90,
    audio.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    180,
    audio.currentTime+.08
  );

  gain.gain.setValueAtTime(
    .025,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.11
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+.12);
}

function beep(freq=700){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="square";
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    .035,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.08
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+.09);
}

function warningSound(){

  if(!audio)return;

  [0,.14,.28].forEach(delay=>{

    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type="square";
    osc.frequency.value=880;

    gain.gain.setValueAtTime(
      .035,
      audio.currentTime+delay
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+delay+.1
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(audio.currentTime+delay);

    osc.stop(
      audio.currentTime+delay+.11
    );

  });
}

function countdownSound(final=false){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="square";

  osc.frequency.value=
    final?1200:650;

  gain.gain.setValueAtTime(
    final?.07:.04,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+.2);
}

function crashSound(){

  if(!audio)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    180,
    audio.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    25,
    audio.currentTime+.65
  );

  gain.gain.setValueAtTime(
    .12,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.65
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+.7);
}


/* CLOCK */

const started=performance.now();

setInterval(()=>{

  const t=performance.now()-started;
  const s=Math.floor(t/1000);
  const ms=Math.floor(t%1000);

  document.getElementById("time")
    .textContent=
    `00:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;

},20);


/* MATRIX */

const canvas=
  document.getElementById("matrix");

const ctx=canvas.getContext("2d");

function resize(){

  canvas.width=innerWidth;
  canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

const chars="01ABCDEF#$%&@<>[]{}";

let drops=[];

function resetDrops(){

  drops=Array(
    Math.floor(innerWidth/15)
  ).fill(1);

}

resetDrops();

setInterval(()=>{

  ctx.fillStyle="rgba(0,0,0,.09)";

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle="#19ff68";
  ctx.font="14px monospace";

  for(let i=0;i<drops.length;i++){

    ctx.fillText(
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ],
      i*15,
      drops[i]*15
    );

    if(
      drops[i]*15>canvas.height &&
      Math.random()>.97
    ){
      drops[i]=0;
    }

    drops[i]++;
  }

},40);


/* HELPERS */

const log=document.getElementById("log");

function wait(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function line(text="",cls=""){

  const d=document.createElement("div");

  d.className=cls;
  d.textContent=text;

  log.appendChild(d);

  log.scrollTop=log.scrollHeight;

  keySound();
}

function hex(n=8){

  const chars="0123456789ABCDEF";

  let s="";

  for(let i=0;i<n;i++){

    s+=chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];

  }

  return s;
}


/* PROGRESS */

function progress(label,duration){

  return new Promise(resolve=>{

    const d=document.createElement("div");
    const bar=document.createElement("span");
    const fill=document.createElement("span");

    bar.className="bar";
    fill.className="fill";

    bar.appendChild(fill);

    d.append(
      document.createTextNode(label+" "),
      bar
    );

    log.appendChild(d);

    diskSound();

    const start=performance.now();

    function update(){

      const p=Math.min(
        1,
        (performance.now()-start)/duration
      );

      fill.style.width=(p*100)+"%";

      if(p<1){

        requestAnimationFrame(update);

      }else{

        resolve();

      }
    }

    requestAnimationFrame(update);

  });
}


/* NOTIFICATIONS */

async function notify(
  rtl,
  sender,
  title,
  message
){

  const container=
    document.getElementById("notifications");

  const n=document.createElement("div");

  n.className=
    "notification"+
    (rtl?" rtl":"");

  n.innerHTML=`

    <div class="icon">!</div>

    <div>

      <div class="sender">
        ${sender}
        <span class="time">now</span>
      </div>

      <div class="title">
        ${title}
      </div>

      <div class="message">
        ${message}
      </div>

    </div>
  `;

  container.appendChild(n);

  warningSound();

  await wait(2500);

  n.classList.add("out");

  await wait(300);

  n.remove();
}


/* ACCESS DENIED */

async function accessDenied(){

  const el=
    document.getElementById(
      "accessDenied"
    );

  beep(300);

  el.classList.add("show");

  await wait(450);

  el.classList.remove("show");
}


/* MAIN */

async function run(){

  initAudio();

  line(
    "$ ./runtime --attach --quiet",
    "cyan"
  );

  await wait(100);

  line(
    "[000] session=0x"+hex(10)
  );

  await wait(80);

  line(
    "[001] arch=x86_64 pid="+
    (4000+Math.floor(Math.random()*5000))
  );

  await wait(80);

  line(
    "[002] initializing network trace..."
  );

  await wait(100);

  line(
    "[003] node_01  10.0."+Math.floor(Math.random()*255)+".1  CONNECTED",
    "green"
  );

  await wait(90);

  line(
    "[004] node_02  172.16."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255)+"  CONNECTED",
    "green"
  );

  await wait(90);

  line(
    "[005] relay_01 192.168."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255),
    "cyan"
  );

  await wait(80);

  line(
    "[006] route status=ACTIVE",
    "green"
  );

  notify(
    true,
    "Runtime Security",
    "هشدار امنیتی",
    "بررسی وضعیت نشست انجام شد."
  );

  await progress(
    "[007] scanning environment",
    350
  );

  line(
    "[008] browser cache ............ OK"
  );

  await wait(80);

  line(
    "[009] local storage ........... OK"
  );

  await wait(80);

  line(
    "[010] temporary data .......... OK"
  );

  await wait(80);

  line(
    "[011] protected area .......... LOCKED",
    "yellow"
  );

  await accessDenied();

  notify(
    false,
    "Runtime Security",
    "Security Check",
    "Additional verification required."
  );

  await progress(
    "[012] analyzing packet stream",
    350
  );

  line(
    "[013] packet_01 ............... RECEIVED"
  );

  await wait(70);

  line(
    "[014] packet_02 ............... RECEIVED"
  );

  await wait(70);

  line(
    "[015] packet_03 ............... RECEIVED"
  );

  await wait(70);

  line(
    "[016] route integrity .......... VERIFIED",
    "green"
  );

  notify(
    true,
    "Runtime Security",
    "هشدار نهایی",
    "آخرین مرحله بررسی در حال اجراست."
  );

  await progress(
    "[017] preparing encrypted_state",
    350
  );

  line(
    "[018] decrypting_data.bin"
  );

  await wait(150);

  line(
    "[019] decrypt progress ........ 99%",
    "yellow"
  );

  await wait(180);


  /* CRITICAL */

  const critical=
    document.getElementById("critical");

  critical.classList.add("show");

  warningSound();

  await wait(500);

  critical.classList.remove("show");


  line(
    "[FINAL] session sequence complete",
    "red"
  );

  await wait(180);


  /* GLITCH */

  const glitch=
    document.getElementById("glitch");

  glitch.classList.add(
    "glitch-active"
  );

  document.body.classList.add(
    "shake"
  );

  beep(1100);

  await wait(220);

  glitch.classList.remove(
    "glitch-active"
  );

  document.body.classList.remove(
    "shake"
  );

  await wait(120);


  /* COUNTDOWN */

  const cd=
    document.getElementById("countdown");

  cd.classList.remove("hidden");

  for(let n=3;n>=1;n--){

    cd.textContent=n;

    countdownSound(n===1);

    if(n===1){

      document.body.classList.add(
        "shake"
      );

    }

    await wait(450);
  }

  document.body.classList.remove(
    "shake"
  );

  cd.textContent="";

  cd.classList.add("flash");

  await wait(100);


  /* FINAL GLITCH */

  glitch.classList.add(
    "glitch-active"
  );

  crashSound();

  await wait(220);

  cd.classList.add("hidden");

  glitch.classList.remove(
    "glitch-active"
  );

  document.getElementById(
    "app"
  ).style.display="none";

  canvas.style.display="none";


  /* SYSTEM FAILURE */

  const crash=
    document.getElementById("crash");

  crash.classList.add("show");

  await wait(700);


  /* BLACKOUT */

  document.body.innerHTML="";

  document.body.style.background="#000";

  document.body.style.cursor="none";


  /*
    Try to close the tab.
    Browsers may block this if the tab
    was not opened by JavaScript.
  */

  await wait(300);

  window.close();

}


/* AUTO START */

run();

</script>

</body>
</html>
