<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>runtime.log</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020403;
  color:#b7ffca;
  font-family:"Courier New",Consolas,monospace;
}

body{
  text-shadow:0 0 5px rgba(80,255,130,.28);
}

canvas{
  position:fixed;
  inset:0;
  opacity:.08;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  padding:18px;
  overflow:hidden;
}

.top{
  height:34px;
  border-bottom:1px solid #163d23;
  color:#6d9d78;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#log{
  height:calc(100% - 34px);
  padding-top:12px;
  overflow:hidden;
  white-space:pre;
  font-size:clamp(10px,1.15vw,14px);
  line-height:1.42;
}

.green{color:#8cffaa}
.cyan{color:#73e9ff}
.yellow{color:#e4d76a}

.red{
  color:#ff5151;
  text-shadow:0 0 9px rgba(255,40,40,.6);
}

.bar{
  display:inline-block;
  width:240px;
  height:10px;
  border:1px solid #315e3d;
  padding:1px;
  vertical-align:middle;
}

.fill{
  display:block;
  height:100%;
  width:0;
  background:#74ff94;
  box-shadow:0 0 10px #74ff94;
}

#countdown{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.94);
  color:#ff3434;
  font-size:clamp(120px,28vw,300px);
  text-shadow:0 0 35px red;
}

.hidden{
  display:none!important;
}

.flash{
  animation:flash .11s infinite;
}

.shake{
  animation:shake .07s infinite;
}


/* =========================================
   FAKE NOTIFICATIONS
========================================= */

#notifications{
  position:fixed;
  top:18px;
  right:18px;
  z-index:700;

  width:min(380px,calc(100vw - 36px));

  display:flex;
  flex-direction:column;
  gap:10px;

  pointer-events:none;
}

.notification{
  direction:rtl;

  background:rgba(18,20,22,.96);

  border:1px solid #3a3a3a;

  border-radius:14px;

  padding:12px 14px;

  color:#fff;

  font-family:
    Arial,
    "Tahoma",
    sans-serif;

  box-shadow:
    0 8px 30px rgba(0,0,0,.55);

  transform:translateX(120%);

  opacity:0;

  animation:
    notificationIn .45s ease forwards;
}

.notification .head{
  display:flex;
  align-items:center;
  gap:9px;

  font-size:12px;
  color:#aaa;

  margin-bottom:7px;
}

.notification .icon{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#b71919;

  color:#fff;

  font-weight:bold;
}

.notification .title{
  font-size:14px;
  font-weight:bold;
  color:#fff;
}

.notification .message{
  font-size:13px;
  line-height:1.6;
  color:#ddd;
}

.notification .time{
  direction:ltr;
  float:left;
  color:#777;
  font-size:10px;
}

.notification.eng{
  direction:ltr;
}

.notification.eng .time{
  float:right;
}

@keyframes notificationIn{

  to{
    transform:translateX(0);
    opacity:1;
  }

}

.notification.out{
  animation:
    notificationOut .4s ease forwards;
}

@keyframes notificationOut{

  to{
    transform:translateX(120%);
    opacity:0;
  }

}


/* =========================================
   GLITCH
========================================= */

#glitch{
  position:fixed;
  inset:0;
  z-index:999;

  display:none;

  background:#000;

  pointer-events:none;
}

#glitch::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.09) 4px
    );
}

#glitch::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,0,0,.3) 48%,
      transparent 52%
    );
}

.glitch-active{
  display:block!important;
  animation:glitchScreen .08s infinite;
}

@keyframes glitchScreen{

  0%{
    transform:translate(0);
    filter:none;
  }

  20%{
    transform:translate(-15px,4px);
    filter:hue-rotate(90deg) contrast(2);
  }

  40%{
    transform:translate(12px,-5px);
    filter:invert(.2) contrast(3);
  }

  60%{
    transform:translate(-8px,7px);
    filter:hue-rotate(180deg);
  }

  80%{
    transform:translate(10px,-6px);
    filter:contrast(4);
  }

  100%{
    transform:translate(0);
    filter:none;
  }
}


/* =========================================
   SYSTEM FAILURE
========================================= */

#crash{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#000;

  text-align:center;

  color:#ff3030;
}

#crash.show{
  display:flex;
}

#crash .title{
  font-size:clamp(30px,6vw,80px);

  font-weight:bold;

  letter-spacing:8px;

  text-shadow:
    0 0 10px red,
    0 0 30px red,
    0 0 60px rgba(255,0,0,.5);
}

#crash .sub{
  margin-top:18px;

  font-size:clamp(10px,1.5vw,16px);

  color:#666;

  letter-spacing:3px;
}

#crash .cursor{
  display:inline-block;

  width:8px;
  height:18px;

  background:#ff3030;

  margin-left:5px;

  animation:blink .6s infinite;
}


/* =========================================
   TERMINATED
========================================= */

#terminated{
  position:fixed;
  inset:0;
  z-index:1100;

  display:none;

  align-items:center;
  justify-content:center;

  background:#000;

  color:#777;

  font-family:"Courier New",monospace;

  font-size:clamp(10px,1.2vw,15px);

  letter-spacing:4px;

  opacity:0;
}

#terminated.show{
  display:flex;
  animation:terminalFade 2.2s forwards;
}

@keyframes terminalFade{

  0%{opacity:0}
  30%{opacity:.8}
  70%{opacity:.8}
  100%{opacity:0}

}


/* =========================================
   CRT
========================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;

  z-index:500;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 1px,
      transparent 2px,
      transparent 4px
    );

  opacity:.45;
}

body::after{
  content:"";
  position:fixed;
  inset:0;

  z-index:501;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.55) 100%
    );

  box-shadow:
    inset 0 0 100px rgba(0,0,0,.8);
}


@keyframes flash{
  50%{opacity:.08}
}

@keyframes shake{

  25%{
    transform:translate(4px,-2px);
  }

  50%{
    transform:translate(-4px,3px);
  }

  75%{
    transform:translate(3px,1px);
  }

}

@keyframes blink{
  50%{opacity:0}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

  <div class="top">

    <span>
      runtime/diagnostic
    </span>

    <span id="time">
      00:00.000
    </span>

  </div>

  <div id="log"></div>

</div>


<div id="countdown" class="hidden">
  3
</div>


<!-- =========================================
     FAKE NOTIFICATIONS
========================================= -->

<div id="notifications"></div>


<!-- =========================================
     GLITCH
========================================= -->

<div id="glitch"></div>


<!-- =========================================
     CRASH
========================================= -->

<div id="crash">

  <div class="title">
    SYSTEM FAILURE
  </div>

  <div class="sub">
    runtime terminated unexpectedly
    <span class="cursor"></span>
  </div>

</div>


<!-- =========================================
     TERMINATED
========================================= -->

<div id="terminated">
  connection terminated.
</div>


<script>

/* =========================================
   AUDIO
========================================= */

let audio=null;

const started =
  performance.now();


function initAudio(){

  if(!audio){

    audio =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audio.state==="suspended"){
    audio.resume();
  }

}


/* =========================================
   SOUNDS
========================================= */

function keySound(){

  if(!audio)return;

  const osc=
    audio.createOscillator();

  const gain=
    audio.createGain();

  osc.type="square";

  osc.frequency.value=
    420+Math.random()*300;

  gain.gain.setValueAtTime(
    .018,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.035
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+.04
  );

}


function scanSound(){

  if(!audio)return;

  const osc=
    audio.createOscillator();

  const gain=
    audio.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    350,
    audio.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    850,
    audio.currentTime+.12
  );

  gain.gain.setValueAtTime(
    .025,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.14
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+.15
  );

}


function warningSound(){

  if(!audio)return;

  [0,.18,.36].forEach(
    delay=>{

      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();

      osc.type="square";

      osc.frequency.value=880;

      gain.gain.setValueAtTime(
        .035,
        audio.currentTime+delay
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+
        delay+
        .1
      );

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start(
        audio.currentTime+delay
      );

      osc.stop(
        audio.currentTime+
        delay+
        .11
      );

    }
  );

}


function crashSound(){

  if(!audio)return;

  const osc=
    audio.createOscillator();

  const gain=
    audio.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    180,
    audio.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    30,
    audio.currentTime+.7
  );

  gain.gain.setValueAtTime(
    .12,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.7
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+.75
  );

}


function countdownSound(final=false){

  if(!audio)return;

  const osc=
    audio.createOscillator();

  const gain=
    audio.createGain();

  osc.type="square";

  osc.frequency.value=
    final?1200:650;

  gain.gain.setValueAtTime(
    final?.07:.04,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+.18
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+.2
  );

}


/* =========================================
   CLOCK
========================================= */

setInterval(()=>{

  const t=
    performance.now()-started;

  const s=
    Math.floor(t/1000);

  const ms=
    Math.floor(t%1000);

  document
    .getElementById("time")
    .textContent=
      `00:${String(s)
        .padStart(2,"0")}.${String(ms)
        .padStart(3,"0")}`;

},20);


/* =========================================
   MATRIX
========================================= */

const canvas=
  document.getElementById("matrix");

const ctx=
  canvas.getContext("2d");


function resize(){

  canvas.width=
    innerWidth;

  canvas.height=
    innerHeight;

}

resize();

addEventListener(
  "resize",
  resize
);


const chars=
  "01ABCDEF#$%&@<>[]{}";

let drops=[];


function resetDrops(){

  drops=
    Array(
      Math.floor(innerWidth/15)
    ).fill(1);

}

resetDrops();


setInterval(()=>{

  ctx.fillStyle=
    "rgba(0,0,0,.09)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle=
    "#19ff68";

  ctx.font=
    "14px monospace";


  for(
    let i=0;
    i<drops.length;
    i++
  ){

    ctx.fillText(

      chars[
        Math.floor(
          Math.random()*
          chars.length
        )
      ],

      i*15,
      drops[i]*15

    );


    if(
      drops[i]*15>
      canvas.height &&
      Math.random()>.97
    ){

      drops[i]=0;

    }

    drops[i]++;

  }

},40);


/* =========================================
   TERMINAL
========================================= */

const log=
  document.getElementById("log");


function wait(ms){

  return new Promise(
    r=>setTimeout(r,ms)
  );

}


function line(
  text="",
  cls=""
){

  const d=
    document.createElement("div");

  d.className=cls;

  d.textContent=text;

  log.appendChild(d);

  log.scrollTop=
    log.scrollHeight;

  keySound();

}


/* =========================================
   PROGRESS
========================================= */

function progress(
  label,
  duration
){

  return new Promise(
    resolve=>{

      const d=
        document.createElement("div");

      const bar=
        document.createElement("span");

      const fill=
        document.createElement("span");


      bar.className="bar";

      fill.className="fill";

      bar.appendChild(fill);


      d.append(
        document.createTextNode(
          label+" "
        ),
        bar
      );


      log.appendChild(d);

      scanSound();


      const start=
        performance.now();


      function update(){

        const p=
          Math.min(
            1,
            (
              performance.now()-
              start
            )/duration
          );


        fill.style.width=
          p*100+"%";


        if(p<1){

          requestAnimationFrame(
            update
          );

        }else{

          resolve();

        }

      }


      requestAnimationFrame(
        update
      );

    }
  );

}


/* =========================================
   RANDOM HEX
========================================= */

function hex(n=8){

  const chars=
    "0123456789ABCDEF";

  let s="";


  for(
    let i=0;
    i<n;
    i++
  ){

    s+=
      chars[
        Math.floor(
          Math.random()*16
        )
      ];

  }


  return s;

}


const bytes=[

  "7F 45 4C 46 02 01 01 00",

  "48 8B 05 91 2A 00 00 48",

  "31 C0 48 89 E7 E8 19 00",

  "FF 25 72 10 00 00 90 90",

  "0F 1F 84 00 00 00 00 00",

  "55 48 89 E5 48 83 EC 30"

];


/* =========================================
   FAKE NOTIFICATION
========================================= */

async function fakeNotification(
  language,
  title,
  message
){

  const container=
    document.getElementById(
      "notifications"
    );


  const n=
    document.createElement("div");


  n.className=
    "notification"+
    (language==="en"
      ?" eng"
      :"");


  const icon=
    language==="en"
      ?"!"
      :"⚠";


  n.innerHTML=`

    <div class="head">

      <div class="icon">
        ${icon}
      </div>

      <div class="title">
        ${title}
      </div>

      <span class="time">
        الآن
      </span>

    </div>

    <div class="message">
      ${message}
    </div>

  `;


  container.appendChild(n);

  warningSound();


  await wait(4200);


  n.classList.add("out");


  await wait(450);


  n.remove();

}


/* =========================================
   MAIN
========================================= */

async function run(){

  initAudio();


  line(
    "$ ./runtime --attach --quiet",
    "cyan"
  );


  await wait(70);


  line(
    "[000] pid=4812 tid=07 arch=x86_64"
  );


  line(
    "[001] ctx=0x"+
    hex(12)+
    " sp=0x"+
    hex(12)
  );


  await wait(70);


/* =========================================
   MEMORY
========================================= */

  for(
    let i=0;
    i<3;
    i++
  ){

    line(
      `[${String(i+2)
        .padStart(3,"0")}] `+
      `0x00${hex(6)} `+
      bytes[i]
    );

    await wait(65);

  }


  await progress(
    "[005] resolving symbols",
    280
  );


  for(
    let i=0;
    i<4;
    i++
  ){

    line(
      `[${String(i+6)
        .padStart(3,"0")}] `+
      `map=0x${hex(8)} `+
      `len=0x${hex(4)} `+
      `perm=r-x`
    );

    await wait(60);

  }


/* =========================================
   FIRST NOTIFICATION
========================================= */

  fakeNotification(
    "fa",
    "هشدار امنیتی",
    "دسترسی غیرمجاز به دستگاه شما شناسایی شد."
  );


  await progress(
    "[010] parsing memory segments",
    300
  );


  for(
    let i=0;
    i<5;
    i++
  ){

    line(
      `[${String(i+11)
        .padStart(3,"0")}] `+
      `addr=0x${hex(12)} `+
      `state=0x${hex(2)}`
    );

    await wait(55);

  }


/* =========================================
   NETWORK
========================================= */

  line(
    "[016] scanning network interfaces..."
  );

  await wait(120);


  line(
    "[017] interface=eth0 state=UP",
    "cyan"
  );


  await wait(80);


  line(
    `[018] local=192.168.1.${Math.floor(
      10+Math.random()*200
    )}`
  );


  await wait(100);


  line(
    "[019] resolving remote endpoint..."
  );


  await wait(130);


  line(
    `[020] remote=185.${Math.floor(
      Math.random()*255
    )}.${Math.floor(
      Math.random()*255
    )}.${Math.floor(
      Math.random()*255
    )}`,
    "cyan"
  );


  await wait(100);


  line(
    "[021] route established",
    "green"
  );


/* =========================================
   SECOND NOTIFICATION
========================================= */

  fakeNotification(
    "en",
    "Security Alert",
    "Unauthorized access detected. Device integrity has been compromised."
  );


  await progress(
    "[022] analyzing packet stream",
    360
  );


  for(
    let i=0;
    i<5;
    i++
  ){

    line(
      `[${String(23+i)
        .padStart(3,"0")}] `+
      `packet=0x${hex(8)} `+
      `size=${64+
        Math.floor(
          Math.random()*1400
        )}B `+
      `ttl=${32+
        Math.floor(
          Math.random()*64
        )}`
    );

    await wait(60);

  }


/* =========================================
   STATE
========================================= */

  line(
    `[028] checksum=0x${hex(8)} `+
    `entropy=7.${hex(4)}`
  );


  await progress(
    "[029] validating execution context",
    300
  );


  line(
    `[030] rsp=0x${hex(12)} `+
    `rbp=0x${hex(12)}`
  );


  line(
    `[031] flags=0x${hex(4)} `+
    `state=0x${hex(2)}`
  );


  line(
    `[032] nonce=${hex(24)}`
  );


  await wait(100);


  line(
    `[033] digest=${hex(32)}`,
    "cyan"
  );


/* =========================================
   THIRD NOTIFICATION
========================================= */

  fakeNotification(
    "fa",
    "دستگاه شما هک شد",
    "تمامی دسترسی‌ها در حال بررسی است. برای جلوگیری از آسیب بیشتر دستگاه را خاموش نکنید."
  );


  await progress(
    "[034] rebuilding state vector",
    300
  );


  line(
    `[035] frame=0x${hex(16)}`
  );


  line(
    `[036] return=0x${hex(12)}`
  );


  await wait(90);


  line(
    "[037] state transition: 0x03 -> 0x04",
    "green"
  );


  await progress(
    "[038] committing state",
    280
  );


  line(
    `[039] seq=${hex(10)} `+
    `status=0x${hex(2)}`
  );


  warningSound();


  await wait(120);


  line(
    "[040] integrity boundary crossed",
    "red"
  );


  document.body.classList.add(
    "shake"
  );


  await wait(180);


  document.body.classList.remove(
    "shake"
  );


  line(
    `[041] session=${hex(16)}`,
    "cyan"
  );


  line(
    "[042] transition pending...",
    "yellow"
  );


  await wait(100);


  line(
    `[043] finalize=0x${hex(8)}`,
    "red"
  );


  warningSound();


  await wait(150);


/* =========================================
   COUNTDOWN
========================================= */

  const cd=
    document.getElementById(
      "countdown"
    );


  cd.classList.remove(
    "hidden"
  );


  for(
    let n=3;
    n>=1;
    n--
  ){

    cd.textContent=n;


    countdownSound(
      n===1
    );


    if(n===1){

      document.body.classList.add(
        "shake"
      );

    }


    await wait(1000);

  }


  cd.textContent="";


  cd.classList.add(
    "flash"
  );


  countdownSound(true);


  await wait(350);


  document.body.classList.remove(
    "shake"
  );


/* =========================================
   FINAL GLITCH
========================================= */

  const glitch=
    document.getElementById(
      "glitch"
    );


  const crash=
    document.getElementById(
      "crash"
    );


  const terminated=
    document.getElementById(
      "terminated"
    );


  cd.classList.add(
    "hidden"
  );


  document.body.classList.add(
    "shake"
  );


  glitch.classList.add(
    "glitch-active"
  );


  warningSound();

  crashSound();


  for(
    let i=0;
    i<14;
    i++
  ){

    await wait(55);


    document.body.style.filter=
      i%2===0
        ? "invert(.25) contrast(3) hue-rotate(90deg)"
        : "none";

  }


  document.body.classList.remove(
    "shake"
  );


  document.body.style.filter=
    "none";


  glitch.classList.remove(
    "glitch-active"
  );


/* =========================================
   SYSTEM FAILURE
========================================= */

  document
    .getElementById("app")
    .style.display="none";


  canvas.style.display="none";


  await wait(120);


  crash.classList.add(
    "show"
  );


  await wait(1900);


  crash.classList.remove(
    "show"
  );


/* =========================================
   FINAL BLACKOUT
========================================= */

  document.body.style.background=
    "#000";


  await wait(350);


  terminated.classList.add(
    "show"
  );


  await wait(2200);


  terminated.classList.remove(
    "show"
  );


  document.body.style.cursor=
    "none";


  document.body.innerHTML="";


  document.body.style.background=
    "#000";


  await wait(1000);


  window.close();

}


/* =========================================
   START AUTOMATICALLY
========================================= */

run();

</script>
